openapi: 3.0.3
info:
  title: STAC API
  version: 1.0.0
  description: STAC API backed by PgSTAC. Replaced on each request by the service title and abstract.
servers:
  - url: http://localhost:8080/geoserver/ogc/stac/v1
# the response schemas are the official STAC API ones, referenced rather than copied; every GET also has HTML
paths:
  /:
    get:
      tags: [Capabilities]
      summary: landing page
      operationId: getLandingPage
      responses:
        '200':
          $ref: '#/components/responses/LandingPage'
        '500':
          $ref: '#/components/responses/Error'
  /conformance:
    get:
      tags: [Capabilities]
      summary: conformance classes the server implements
      operationId: getConformanceDeclaration
      responses:
        '200':
          $ref: '#/components/responses/ConformanceDeclaration'
        '500':
          $ref: '#/components/responses/Error'
  /openapi:
    get:
      tags: [Capabilities]
      summary: this API definition
      operationId: getApi
      responses:
        '200':
          description: The OpenAPI definition of the API.
          content:
            application/vnd.oai.openapi+json;version=3.0:
              schema:
                type: object
            application/yaml:
              schema:
                type: object
            text/html:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/Error'
  /collections:
    get:
      tags: [Data]
      summary: the collections, a page at a time
      operationId: getCollections
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200':
          $ref: '#/components/responses/Collections'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Transactions]
      summary: creates a collection
      operationId: createCollection
      description: Only while the service level is TRANSACTIONAL, for administrators.
      security:
        - basicAuth: []
      requestBody:
        $ref: '#/components/requestBodies/Collection'
      responses:
        '201':
          $ref: '#/components/responses/CreatedCollection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /collections/{collectionId}:
    get:
      tags: [Data]
      summary: a single collection
      operationId: getCollection
      parameters:
        - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Transactions]
      summary: replaces a collection
      operationId: replaceCollection
      description: Only while the service level is TRANSACTIONAL, for administrators.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/collectionId'
      requestBody:
        $ref: '#/components/requestBodies/Collection'
      responses:
        '200':
          $ref: '#/components/responses/StoredCollection'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Transactions]
      summary: deletes a collection and its items
      operationId: deleteCollection
      description: Only while the service level is TRANSACTIONAL, for administrators.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/collectionId'
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /collections/{collectionId}/items:
    get:
      tags: [Data]
      summary: the items of a collection, a page at a time
      operationId: getItems
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/bbox'
        - $ref: '#/components/parameters/intersects'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/token'
        - $ref: '#/components/parameters/sortby'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/filter-lang'
        - $ref: '#/components/parameters/filter-crs'
      responses:
        '200':
          $ref: '#/components/responses/ItemCollection'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Transactions]
      summary: creates an item, one at a time
      operationId: createItem
      description: Only while the service level is TRANSACTIONAL, for administrators.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/collectionId'
      requestBody:
        $ref: '#/components/requestBodies/Item'
      responses:
        '201':
          $ref: '#/components/responses/CreatedItem'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /collections/{collectionId}/items/{itemId}:
    get:
      tags: [Data]
      summary: a single item
      operationId: getItem
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/itemId'
      responses:
        '200':
          $ref: '#/components/responses/Item'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    put:
      tags: [Transactions]
      summary: replaces an item
      operationId: replaceItem
      description: Only while the service level is TRANSACTIONAL, for administrators.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/itemId'
      requestBody:
        $ref: '#/components/requestBodies/Item'
      responses:
        '200':
          $ref: '#/components/responses/StoredItem'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    delete:
      tags: [Transactions]
      summary: deletes an item
      operationId: deleteItem
      description: Only while the service level is TRANSACTIONAL, for administrators.
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/collectionId'
        - $ref: '#/components/parameters/itemId'
      responses:
        '204':
          description: Deleted.
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /search:
    get:
      tags: [Item Search]
      summary: searches the items of all collections
      operationId: searchGet
      parameters:
        - $ref: '#/components/parameters/collections'
        - $ref: '#/components/parameters/ids'
        - $ref: '#/components/parameters/bbox'
        - $ref: '#/components/parameters/intersects'
        - $ref: '#/components/parameters/datetime'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/token'
        - $ref: '#/components/parameters/sortby'
        - $ref: '#/components/parameters/fields'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/filter-lang'
        - $ref: '#/components/parameters/filter-crs'
      responses:
        '200':
          $ref: '#/components/responses/ItemCollection'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
    post:
      tags: [Item Search]
      summary: searches the items of all collections, the paging links repeat the body with the token merged
      operationId: searchPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/schemas/searchBody'
                - type: object
                  properties:
                    token:
                      type: string
                    sortby:
                      type: array
                      items:
                        type: object
                        required: [field]
                        properties:
                          field:
                            type: string
                          direction:
                            type: string
                            enum: [asc, desc]
                            default: asc
                    fields:
                      type: object
                      properties:
                        include:
                          type: array
                          items:
                            type: string
                        exclude:
                          type: array
                          items:
                            type: string
                    filter:
                      description: A CQL2 text string or a CQL2 JSON object, as filter-lang tells.
                      oneOf:
                        - type: string
                        - type: object
                    filter-lang:
                      description: Defaults to cql2-json for an object filter, cql2-text for a string one.
                      type: string
                      enum: [cql2-text, cql2-json]
                    filter-crs:
                      type: string
                      default: http://www.opengis.net/def/crs/OGC/1.3/CRS84
      responses:
        '200':
          $ref: '#/components/responses/SearchPost'
        '400':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /queryables:
    get:
      tags: [Filter]
      summary: the properties usable in filters across all collections
      operationId: getQueryables
      responses:
        '200':
          $ref: '#/components/responses/Schema'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /collections/{collectionId}/queryables:
    get:
      tags: [Filter]
      summary: the properties usable in filters on a collection
      operationId: getCollectionQueryables
      parameters:
        - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          $ref: '#/components/responses/Schema'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /sortables:
    get:
      tags: [Sort]
      summary: the properties usable in sortby across all collections
      operationId: getSortables
      responses:
        '200':
          $ref: '#/components/responses/Schema'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /collections/{collectionId}/sortables:
    get:
      tags: [Sort]
      summary: the properties usable in sortby on a collection
      operationId: getCollectionSortables
      parameters:
        - $ref: '#/components/parameters/collectionId'
      responses:
        '200':
          $ref: '#/components/responses/Schema'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
components:
  parameters:
    collectionId:
      name: collectionId
      in: path
      required: true
      description: The id of a collection, as listed by /collections.
      schema:
        type: string
    itemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    limit:
      name: limit
      in: query
      description: The page size. A value above the maximum is not an error, the maximum is used instead.
      schema:
        type: integer
        minimum: 1
    offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    collections:
      $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/parameters/collectionsArray'
    ids:
      $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/parameters/ids'
    bbox:
      $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/parameters/bbox'
    intersects:
      $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/parameters/intersects'
    datetime:
      $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/parameters/datetime'
    token:
      name: token
      in: query
      description: The paging token, taken from a next or prev link.
      schema:
        type: string
    sortby:
      name: sortby
      in: query
      description: Comma separated properties, each with an optional + or - prefix for the direction.
      example: -datetime,+id
      schema:
        type: string
    fields:
      name: fields
      in: query
      description: Comma separated properties to include, or with a - prefix to exclude.
      example: id,-properties.description
      schema:
        type: string
    filter:
      name: filter
      in: query
      description: A CQL2 filter, in the language filter-lang tells.
      schema:
        type: string
    filter-lang:
      name: filter-lang
      in: query
      schema:
        type: string
        enum: [cql2-text, cql2-json]
        default: cql2-text
    filter-crs:
      name: filter-crs
      in: query
      description: Only CRS84 is supported, in any of its spellings.
      schema:
        type: string
        default: http://www.opengis.net/def/crs/OGC/1.3/CRS84
  # the official STAC response objects cannot be extended with the HTML representation, so their schemas are used here
  responses:
    LandingPage:
      description: The landing page, a STAC catalog.
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/core/openapi.yaml#/components/schemas/landingPage'
        text/html:
          schema:
            type: string
    ConformanceDeclaration:
      description: The conformance classes implemented.
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/core/openapi.yaml#/components/schemas/conformanceClasses'
        text/html:
          schema:
            type: string
    Collections:
      description: A page of collections.
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/collections/openapi.yaml#/components/schemas/collections'
        text/html:
          schema:
            type: string
    Collection:
      description: A collection.
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/collections/openapi.yaml#/components/schemas/collection'
        text/html:
          schema:
            type: string
    ItemCollection:
      description: A page of items.
      content:
        application/geo+json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/schemas/itemCollection'
        text/html:
          schema:
            type: string
    SearchPost:
      description: A page of items, the paging links carry the body to post.
      content:
        application/geo+json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/item-search/openapi.yaml#/components/schemas/itemCollection'
    Item:
      description: An item.
      content:
        application/geo+json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/ogcapi-features/openapi.yaml#/components/schemas/item'
        text/html:
          schema:
            type: string
    Schema:
      description: A JSON Schema listing the properties.
      content:
        application/schema+json:
          schema:
            type: object
        text/html:
          schema:
            type: string
    Error:
      description: An error, with a code and a description.
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/core/openapi.yaml#/components/schemas/exception'
    CreatedCollection:
      description: The stored collection.
      headers:
        Location:
          description: The URL of the new resource.
          schema:
            type: string
            format: uri
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/collections/openapi.yaml#/components/schemas/collection'
    StoredCollection:
      description: The stored collection.
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/collections/openapi.yaml#/components/schemas/collection'
    CreatedItem:
      description: The stored item.
      headers:
        Location:
          description: The URL of the new resource.
          schema:
            type: string
            format: uri
      content:
        application/geo+json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/ogcapi-features/openapi.yaml#/components/schemas/item'
    StoredItem:
      description: The stored item.
      content:
        application/geo+json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/ogcapi-features/openapi.yaml#/components/schemas/item'
  requestBodies:
    Collection:
      description: A collection; on replace, its id is taken from the path when missing.
      required: true
      content:
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/collections/openapi.yaml#/components/schemas/collection'
    Item:
      description: An item; collection and id are taken from the path when missing.
      required: true
      content:
        application/geo+json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/ogcapi-features/openapi.yaml#/components/schemas/item'
        application/json:
          schema:
            $ref: 'https://api.stacspec.org/v1.0.0/ogcapi-features/openapi.yaml#/components/schemas/item'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
